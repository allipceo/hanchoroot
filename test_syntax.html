<!DOCTYPE html>
<html>
<head>
    <title>JSON 구문 테스트</title>
</head>
<body>
    <h1>JSON 구문 테스트</h1>
    <div id="result"></div>
    
    <script src="data/window_core_data.js"></script>
    <script>
        try {
            if (window.CORE_DATA && Array.isArray(window.CORE_DATA)) {
                document.getElementById('result').innerHTML = 
                    '<h2 style="color: green;">✅ 성공!</h2>' +
                    '<p>총 ' + window.CORE_DATA.length + '개 데이터 로드 완료</p>' +
                    '<p>조아영 확인: ' + (window.CORE_DATA.find(p => p.name === '조아영') ? '✅ 발견됨' : '❌ 없음') + '</p>' +
                    '<p>김명진-조성희 확인: ' + (window.CORE_DATA.find(p => p.name === '조성희') ? '✅ 발견됨' : '❌ 없음') + '</p>';
            } else {
                document.getElementById('result').innerHTML = '<h2 style="color: red;">❌ 데이터 구조 오류</h2><p>CORE_DATA 타입: ' + typeof window.CORE_DATA + '</p>';
            }
        } catch (e) {
            document.getElementById('result').innerHTML = '<h2 style="color: red;">❌ JSON 구문 오류</h2><p>' + e.message + '</p>';
        }
    </script>
</body>
</html>
